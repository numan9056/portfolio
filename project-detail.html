<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />

  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── PROJECT PAGE (Behance-style long scroll) ─────────── */
    .pd-header {
      max-width: 1400px;
      margin: 0 auto;
      padding: 56px 48px 36px;
    }
    .pd-back {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px; color: #007891; text-decoration: none;
      margin-bottom: 28px; transition: gap 0.2s ease;
    }
    .pd-back:hover { gap: 12px; }
    .pd-cat {
      font-size: 12px; font-weight: 500; letter-spacing: 2.5px;
      text-transform: uppercase; color: #007891; margin-bottom: 12px;
    }
    .pd-title {
      font-size: 48px; font-weight: 700; line-height: 1.1; color: #111;
      margin-bottom: 14px; max-width: 900px;
    }
    .pd-year { font-size: 14px; color: #aaa; margin-bottom: 18px; }
    .pd-desc {
      font-size: 17px; line-height: 1.65; color: #636363;
      max-width: 720px; white-space: pre-line;
    }

    /* Content blocks stack with no gap, one after another */
    .pd-stack {
      max-width: 1400px;
      margin: 0 auto 72px;
      display: flex; flex-direction: column;
      background: #f2f1ee;
      min-height: 200px;
    }
    .pd-block { display: block; width: 100%; }
    .pd-block img, .pd-block video { display: block; width: 100%; height: auto; }
    .pd-block video { background: #000; max-height: 100vh; }
    .pd-block--embed { position: relative; aspect-ratio: 16 / 9; background: #000; }
    .pd-block--embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .pd-msg { padding: 100px 20px; text-align: center; color: #aaa; font-size: 15px; }
    .pd-msg a { color: #007891; }

    /* Previous / next project */
    .pd-more {
      max-width: 1400px; margin: 0 auto 80px; padding: 0 48px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    }
    .pd-more__link {
      display: flex; align-items: center; gap: 16px; padding: 14px;
      border: 1px solid #e4e2de; border-radius: 14px;
      text-decoration: none; color: #111; transition: border-color .2s, transform .2s;
    }
    .pd-more__link:hover { border-color: #007891; transform: translateY(-2px); }
    .pd-more__link--next { flex-direction: row-reverse; text-align: right; }
    .pd-more__thumb { width: 96px; height: 64px; object-fit: cover; border-radius: 8px; background: #f2f1ee; flex-shrink: 0; }
    .pd-more__label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #aaa; margin-bottom: 4px; }
    .pd-more__title { font-size: 15px; font-weight: 500; line-height: 1.3; }

    [data-theme="dark"] .pd-title { color: #e8e4dc; }
    [data-theme="dark"] .pd-desc  { color: #bbb; }
    [data-theme="dark"] .pd-cat, [data-theme="dark"] .pd-back { color: #1ab8d8; }
    [data-theme="dark"] .pd-stack { background: #1c1c1c; }
    [data-theme="dark"] .pd-more__link { border-color: #333; color: #e8e4dc; }

    @media (max-width: 768px) {
      .pd-header { padding: 32px 18px 24px; }
      .pd-title  { font-size: 30px; }
      .pd-desc   { font-size: 15px; }
      .pd-stack  { margin-bottom: 40px; }
      .pd-more   { grid-template-columns: 1fr; padding: 0 18px; margin-bottom: 48px; }
    }
  </style>
  <script>var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);</script>
</head>
<body>

  <nav class="nav">

      <img src="assets/logo.svg" alt="nümnʊ" height="34" />
    </a>

    <button class="nav__hamburger" id="nav-hamburger" aria-label="Open menu">

      <svg class="icon-close" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="display:none"><line x1="1" y1="1" x2="15" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="15" y1="1" x2="1" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="nav__panel" id="nav-panel">
      <a href="index.html" class="nav__panel-link">Home</a>
      <a href="about.html" class="nav__panel-link">About</a>
      <a href="portfolio.html" class="nav__panel-link nav__panel-link--active">Portfolio</a>

  <!-- PROJECT HEADER -->

            <path d="M9 16h7c2.5 0 4 1.2 4 3.4S18.5 23 16 23H9V16z" stroke="#636363" stroke-width="1.8"/>

  <script src="animations.js"></script>
  <script>
    var CAT_LABEL = { ui: 'UI Design', graphic: 'Graphic Design', branding: 'Branding', campaign: 'Campaign Design' };

    function escHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Stable address for a project. Older projects have no id, so use their image name.
    function projectId(p, index) {
      if (p.id) return p.id;
      var m = /[?&]key=([^&]+)/.exec(p.image || '') || /([^\/]+)$/.exec(p.image || '');
      return m ? decodeURIComponent(m[1]).replace(/\.\w+$/, '') : String(index);
    }

    function showMessage(html) {
      document.getElementById('pd-stack').innerHTML = '<p class="pd-msg">' + html + '</p>';
    }

    // Content blocks of a project. Older projects only have a cover image.
    function blocksOf(p) {
      if (p.media && p.media.length) return p.media;
      var blocks = [];
      (p.images || []).forEach(function(u) { blocks.push({ type: 'image', url: u }); });
      (p.videos || []).forEach(function(u) { blocks.push({ type: 'video', url: u }); });
      if (!blocks.length && p.image) blocks.push({ type: 'image', url: p.image });
      return blocks;
    }

    function renderBlock(b, title, eager) {
      var el = document.createElement('div');
      el.className = 'pd-block';
      if (b.type === 'video') {
        var v = document.createElement('video');
        v.src = b.url; v.controls = true; v.playsInline = true; v.preload = 'metadata';
        el.appendChild(v);
      } else if (b.type === 'embed') {
        // Only known players are embedded.
        if (!/^https:\/\/(www\.youtube-nocookie\.com\/embed\/|player\.vimeo\.com\/video\/)[\w-]+$/.test(b.url)) return null;
        el.className += ' pd-block--embed';
        var f = document.createElement('iframe');
        f.src = b.url; f.title = title; f.loading = 'lazy'; f.allowFullscreen = true;
        f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        el.appendChild(f);
      } else {
        var img = document.createElement('img');
        img.src = b.url; img.alt = title;
        if (!eager) img.loading = 'lazy';
        el.appendChild(img);
      }
      return el;
    }

    function moreLink(p, id, label, cls) {
      return '<a class="pd-more__link ' + cls + '" href="project-detail.html?id=' + encodeURIComponent(id) + '">'
        + (p.image ? '<img class="pd-more__thumb" src="' + escHtml(p.image) + '" alt="" loading="lazy" />' : '')
        + '<span><span class="pd-more__label" style="display:block">' + label + '</span>'
        + '<span class="pd-more__title">' + escHtml(p.title) + '</span></span></a>';
    }

    function show(projects, wanted) {
      var index = -1;
      projects.forEach(function(p, i) { if (index < 0 && projectId(p, i) === wanted) index = i; });
      if (index < 0) { showMessage('Project not found. <a href="portfolio.html">Back to portfolio</a>'); return; }

      var p = projects[index];
      document.title = (p.title || 'Project') + ' — Numan';
      document.getElementById('pd-cat').textContent   = CAT_LABEL[p.category] || p.category || '';
      document.getElementById('pd-title').textContent = p.title || 'Untitled';
      document.getElementById('pd-year').textContent  = p.year || '';
      document.getElementById('pd-desc').textContent  = p.description || '';
      if (!p.year) document.getElementById('pd-year').style.display = 'none';
      if (!p.description) document.getElementById('pd-desc').style.display = 'none';

      var stack = document.getElementById('pd-stack');
      stack.innerHTML = '';
      blocksOf(p).forEach(function(b, i) {
        var el = renderBlock(b, p.title || 'Project', i === 0);
        if (el) stack.appendChild(el);
      });
      if (!stack.children.length) showMessage('No content has been added to this project yet.');

      var more = '';
      var prev = projects[index - 1], next = projects[index + 1];
      more += prev ? moreLink(prev, projectId(prev, index - 1), '← Previous', '') : '<span></span>';
      more += next ? moreLink(next, projectId(next, index + 1), 'Next →', 'pd-more__link--next') : '';
      document.getElementById('pd-more').innerHTML = more;
    }

    var wanted = new URLSearchParams(window.location.search).get('id');
    if (wanted === null || wanted === '') {
      showMessage('Project not found. <a href="portfolio.html">Back to portfolio</a>');
    } else {
      // Same source as the gallery: live API first, static JSON as a fallback.
      var jsonUrl = 'data/projects.json?v=' + Date.now();
      fetch('/api/admin?action=projects')
        .then(function(r) { return r.ok ? r.json() : fetch(jsonUrl).then(function(r2) { return r2.json(); }); })
        .catch(function() { return fetch(jsonUrl).then(function(r) { return r.json(); }); })
        .then(function(data) {
          show((data.projects || []).filter(function(p) { return p.published !== false; }), wanted);
        })
        .catch(function() {
          showMessage('Could not load this project. <a href="portfolio.html">Back to portfolio</a>');
        });
    }
  </script>
</body>
