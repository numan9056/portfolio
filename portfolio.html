<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — Numan</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,500&family=Roboto+Condensed:ital,wght@1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>

    /* ── PAGE HEADER ─────────────────────────────────────────── */
    .pg-header {
      padding: 72px 48px 48px;
      border-bottom: 1px solid #e4e2de;
    }

    .pg-header__eyebrow {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #007891;
      display: block;
      margin-bottom: 12px;
    }

    .pg-header__title {
      font-size: 46px;
      font-weight: 700;
      color: #111;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .pg-header__sub {
      font-size: 16px;
      color: #636363;
      max-width: 480px;
      line-height: 1.6;
    }

    /* ── FILTER TABS ─────────────────────────────────────────── */
    .pg-filter {
      padding: 28px 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #e4e2de;
      flex-wrap: wrap;
    }

    .pg-filter__btn {
      font-family: 'Roboto', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #636363;
      background: transparent;
      border: 1.5px solid #e0ddd8;
      border-radius: 100px;
      padding: 7px 18px;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }

    .pg-filter__btn:hover {
      border-color: #007891;
      color: #007891;
    }

    .pg-filter__btn.active {
      background: #007891;
      border-color: #007891;
      color: #fff;
    }

    .pg-filter__count {
      font-size: 11px;
      margin-left: 5px;
      opacity: 0.7;
    }

    /* ── MASONRY GRID ────────────────────────────────────────── */
    .pg-grid {
      padding: 32px 48px 64px;
      columns: 3;
      column-gap: 14px;
    }

    /* ── PORTFOLIO ITEM ──────────────────────────────────────── */
    .pg-item {
      break-inside: avoid;
      margin-bottom: 14px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      display: block;
      text-decoration: none;
      background: #f2f1ee;
      transition: transform 0.4s cubic-bezier(0.16,1,0.3,1),
                  box-shadow 0.4s cubic-bezier(0.16,1,0.3,1);
    }

    .pg-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 48px rgba(0,0,0,0.12);
    }

    /* Image / placeholder area */
    .pg-item__img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    /* Placeholder — used when no image uploaded yet */
    .pg-item__placeholder {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .pg-item__placeholder svg {
      opacity: 0.18;
      width: 48px;
      height: 48px;
    }

    /* Aspect ratios */
    .pg-item--landscape .pg-item__placeholder { aspect-ratio: 4/3; }
    .pg-item--portrait  .pg-item__placeholder { aspect-ratio: 3/4; }
    .pg-item--square    .pg-item__placeholder { aspect-ratio: 1/1; }
    .pg-item--wide      .pg-item__placeholder { aspect-ratio: 16/9; }
    .pg-item--tall      .pg-item__placeholder { aspect-ratio: 2/3; }

    /* Same ratios for real <img> tags */
    .pg-item--landscape .pg-item__img { aspect-ratio: 4/3; }
    .pg-item--portrait  .pg-item__img { aspect-ratio: 3/4; }
    .pg-item--square    .pg-item__img { aspect-ratio: 1/1; }
    .pg-item--wide      .pg-item__img { aspect-ratio: 16/9; }
    .pg-item--tall      .pg-item__img { aspect-ratio: 2/3; }

    /* Category colour themes */
    .pg-item--ui       .pg-item__placeholder { background: linear-gradient(135deg, #d6edf3 0%, #b8d8e4 100%); }
    .pg-item--graphic  .pg-item__placeholder { background: linear-gradient(135deg, #fce8df 0%, #f5cfc0 100%); }
    .pg-item--branding .pg-item__placeholder { background: linear-gradient(135deg, #e8e4f5 0%, #d4cde8 100%); }
    .pg-item--campaign .pg-item__placeholder { background: linear-gradient(135deg, #dff0e5 0%, #c5e0cf 100%); }

    /* Hover overlay */
    .pg-item__overlay {
      position: absolute;
      inset: 0;
      background: rgba(10,10,10,0.72);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .pg-item:hover .pg-item__overlay { opacity: 1; }

    .pg-item__overlay-title {
      font-family: 'Roboto', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .pg-item__overlay-tag {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .pg-item__overlay-cta {
      margin-top: 12px;
      font-size: 12px;
      font-weight: 500;
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.5);
      border-radius: 100px;
      padding: 5px 14px;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .pg-item:hover .pg-item__overlay-cta {
      background: #007891;
      border-color: #007891;
    }

    /* Info bar below image (always visible) */
    .pg-item__info {
      padding: 14px 16px;
      background: #fff;
    }

    .pg-item__title {
      font-size: 13px;
      font-weight: 600;
      color: #111;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pg-item__cat {
      font-size: 11px;
      font-weight: 500;
      color: #007891;
      letter-spacing: 0.5px;
    }

    /* Filter hidden state */
    .pg-item.is-hidden {
      display: none;
    }

    /* Empty state */
    .pg-empty {
      display: none;
      padding: 80px 48px;
      text-align: center;
      color: #aaa;
      font-size: 15px;
    }

    /* ── LIGHTBOX ────────────────────────────────────────── */
    .lb-backdrop {
      position: fixed; inset: 0;
      background: rgba(10,10,10,0.92);
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }
    .lb-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }

    .lb-panel {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      transform: scale(0.94) translateY(16px);
      transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
      position: relative;
    }
    .lb-backdrop.open .lb-panel {
      transform: scale(1) translateY(0);
    }

    .lb-img-wrap {
      width: 100%;
      background: #111;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 58vh;
      overflow: hidden;
    }
    .lb-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      max-height: 58vh;
    }

    .lb-body {
      padding: 24px 28px 28px;
      overflow-y: auto;
    }
    .lb-cat {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #007891;
      margin-bottom: 8px;
    }
    .lb-title {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .lb-year {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 12px;
    }
    .lb-desc {
      font-size: 14px;
      color: #636363;
      line-height: 1.65;
    }

    .lb-close {
      position: absolute;
      top: 14px; right: 14px;
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(6px);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 17px;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
      transition: background 0.2s;
    }
    .lb-close:hover { background: rgba(255,255,255,0.3); }

    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
      transition: background 0.2s;
    }
    .lb-nav:hover { background: rgba(255,255,255,0.28); }
    .lb-prev { left: 14px; }
    .lb-next { right: 14px; }
    .lb-nav:disabled { opacity: 0.2; cursor: default; }

    @media (max-width: 600px) {
      .lb-panel { border-radius: 14px; }
      .lb-body { padding: 18px 20px 24px; }
      .lb-title { font-size: 18px; }
    }

    /* ── Mobile (≤ 640px) ── */
    @media (max-width: 640px) {
      .pg-header { padding: 40px 18px 24px; }
      .pg-header__title { font-size: 32px; }
      .pg-filter { padding: 16px 18px; }
      .pg-grid { padding: 20px 18px 48px; columns: 2; column-gap: 10px; }
      .pg-empty { padding: 40px 18px; }
    }

    /* ── Small phone (≤ 400px) ── */
    @media (max-width: 400px) {
      .pg-header { padding: 32px 14px 18px; }
      .pg-header__title { font-size: 26px; }
      .pg-filter { padding: 12px 14px; }
      .pg-grid { padding: 16px 14px 40px; columns: 1; }
    }

  </style>
  <script>var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);</script>
</head>

  <script src="animations.js"></script>
  <script>
    var CAT_LABEL = { ui: 'UI Design', graphic: 'Graphic Design', branding: 'Branding', campaign: 'Campaign Design' };
    var currentFilter = 'all';
    var allItems = [];
    var allProjects = [];
    var lbIndex = 0;

    function escHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── LIGHTBOX ──────────────────────────────────────────
    var lb        = document.getElementById('lb');
    var lbImg     = document.getElementById('lb-img');
    var lbCat     = document.getElementById('lb-cat');
    var lbTitle   = document.getElementById('lb-title');
    var lbYear    = document.getElementById('lb-year');
    var lbDesc    = document.getElementById('lb-desc');
    var lbPrev    = document.getElementById('lb-prev');
    var lbNext    = document.getElementById('lb-next');

    function openLightbox(index) {
      lbIndex = index;
      var p = allProjects[index];
      lbImg.src   = p.image || '';
      lbImg.alt   = p.title || '';
      lbCat.textContent   = CAT_LABEL[p.category] || p.category || '';
      lbTitle.textContent = p.title || '';
      lbYear.textContent  = p.year  || '';
      lbDesc.textContent  = p.description || '';
      lbPrev.disabled = index === 0;
      lbNext.disabled = index === allProjects.length - 1;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('lb-close').onclick = closeLightbox;

    lb.addEventListener('click', function(e) {
      if (e.target === lb) closeLightbox();
    });

    lbPrev.onclick = function() { if (lbIndex > 0) openLightbox(lbIndex - 1); };
    lbNext.onclick = function() { if (lbIndex < allProjects.length - 1) openLightbox(lbIndex + 1); };

    document.addEventListener('keydown', function(e) {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape')      closeLightbox();
      if (e.key === 'ArrowLeft'  && lbIndex > 0)                      openLightbox(lbIndex - 1);
      if (e.key === 'ArrowRight' && lbIndex < allProjects.length - 1) openLightbox(lbIndex + 1);
    });

    // ── CARD RENDER ───────────────────────────────────────
    function renderCard(p, index) {
      var a = document.createElement('a');
      a.className = 'pg-item';
      a.href = '#';
      a.dataset.category = p.category || 'ui';
      a.dataset.index = index;
      var inner = '';
      if (p.image) {
        inner += '<img src="' + p.image + '" alt="' + escHtml(p.title) + '" class="pg-item__img" loading="lazy" />';
      } else {
        inner += '<div class="pg-item__placeholder" style="aspect-ratio:4/3;background:#f2f1ee;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:13px;">No image</div>';
      }
      inner += '<div class="pg-item__overlay">'
             +   '<p class="pg-item__overlay-title">' + escHtml(p.title) + '</p>'
             +   '<span class="pg-item__overlay-tag">' + escHtml(CAT_LABEL[p.category] || p.category) + '</span>'
             +   (p.year ? '<span class="pg-item__overlay-year" style="font-size:11px;color:rgba(255,255,255,.5);margin-top:2px;display:block;">' + escHtml(p.year) + '</span>' : '')
             +   '<span class="pg-item__overlay-cta">View Project</span>'
             + '</div>'
             + '<div class="pg-item__info">'
             +   '<p class="pg-item__title">' + escHtml(p.title) + '</p>'
             +   '<span class="pg-item__cat">' + escHtml(CAT_LABEL[p.category] || p.category) + '</span>'
             + '</div>';
      a.innerHTML = inner;
      a.addEventListener('click', function(e) {
        e.preventDefault();
        openLightbox(index);
      });
      return a;
    }

    // ── FILTER ────────────────────────────────────────────
    function applyFilter(cat) {
      currentFilter = cat;
      allItems.forEach(function(item) {
        item.classList.toggle('is-hidden', cat !== 'all' && item.dataset.category !== cat);
      });
      document.querySelectorAll('.pg-filter__btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.filter === cat);
      });
    }

    document.querySelectorAll('.pg-filter__btn').forEach(function(btn) {
      btn.addEventListener('click', function() { applyFilter(btn.dataset.filter); });
    });

    // ── LOAD ──────────────────────────────────────────────
    // Try live API first (Netlify Blobs), fall back to static JSON for local dev
    var apiUrl = '/api/admin?action=projects';
    var jsonUrl = 'data/projects.json?v=' + Date.now();
    fetch(apiUrl)
      .then(function(r) { return r.ok ? r.json() : fetch(jsonUrl).then(function(r2) { return r2.json(); }); })
      .catch(function() { return fetch(jsonUrl).then(function(r) { return r.json(); }); })
      .then(function(data) {
        allProjects = (data.projects || []).filter(function(p) { return p.published !== false; });
        var grid = document.getElementById('gallery');
        grid.innerHTML = '';
        allItems = [];

        if (!allProjects.length) {
          grid.innerHTML = '<p style="padding:80px 0;text-align:center;color:#aaa;font-size:15px;grid-column:1/-1">No projects yet — add your first design in the admin panel.</p>';
          return;
        }

        allProjects.forEach(function(p, i) {
          var card = renderCard(p, i);
          grid.appendChild(card);
          allItems.push(card);
        });

        var countEl = document.querySelector('[data-filter="all"] .pg-filter__count');
        if (countEl) countEl.textContent = '(' + allProjects.length + ')';
        applyFilter(currentFilter);
      })
      .catch(function() {
        document.getElementById('gallery').innerHTML = '<p style="padding:80px 0;text-align:center;color:#aaa;grid-column:1/-1">Could not load projects.</p>';
      });
  </script>

  <script>if(window.netlifyIdentity){window.netlifyIdentity.on("init",function(u){if(!u){window.netlifyIdentity.on("login",function(){document.location.href="/admin/";});}})}</script>
</body>
