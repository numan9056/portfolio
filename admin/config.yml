backend:
  name: git-gateway
  branch: main

# Where uploaded images go
media_folder: assets/portfolio
public_folder: /assets/portfolio

# Single JSON file that holds all projects
collections:
  - name: portfolio
    label: Portfolio
    files:
      - name: projects
        label: My Projects
        file: data/projects.json
        fields:
          - label: Projects
            name: projects
            widget: list
            summary: "{{fields.title}} — {{fields.category}}"
            fields:
              - label: Title
                name: title
                widget: string
                hint: "e.g. MistetFunnet Dashboard"

              - label: Category
                name: category
                widget: select
                options:
                  - { label: "UI Design",             value: ui }
                  - { label: "Graphic Design",        value: graphic }
                  - { label: "Branding",              value: branding }
                  - { label: "Campaign Design",       value: campaign }

              - label: Cover Image
                name: image
                widget: image
                hint: "Upload your design screenshot (JPG or PNG)"

              - label: Short Description
                name: description
                widget: text
                required: false
                hint: "One or two sentences about this project"

              - label: Year
                name: year
                widget: string
                required: false
                hint: "e.g. 2024"

              - label: Published
                name: published
                widget: boolean
                default: true
                hint: "Uncheck to hide from the gallery"
